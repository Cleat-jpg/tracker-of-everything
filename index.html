<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fff5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b0f15" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <title>Tracker of Everything</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23be1759'/><text x='16' y='21' font-size='16' text-anchor='middle'>🌸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1 id="ttl">Tracker of everything</h1>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Refresh">⟳</button>
  </header>

  <main id="app"></main>

<!-- In index.html, replace everything inside <nav id="nav"> ... </nav> with these six buttons -->
<nav id="nav">
  <button data-v="home"><b><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5.5h4V20"/></svg></b>Home</button>
  <button data-v="salary"><b><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block" aria-hidden="true"><rect x="3" y="6.5" width="18" height="11" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 12h.01M17.5 12h.01"/></svg></b>Salary</button>
  <button data-v="debts"><b><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block" aria-hidden="true"><path d="M3.5 7l6 6 3.5-3.5 7.5 7.5"/><path d="M15.5 17h5v-5"/></svg></b>Debts</button>
  <button data-v="budget"><b><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block" aria-hidden="true"><rect x="5" y="4.5" width="14" height="16" rx="2.5"/><path d="M9 3v3M15 3v3"/><path d="M8.5 11h7M8.5 15h4.5"/></svg></b>Budget</button>
  <button data-v="savings"><b><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block" aria-hidden="true"><path d="M9 3.5h6l-1.5 3h-3z"/><path d="M10.5 6.5C6.6 8.6 4.5 12 4.5 15.3c0 3.4 3 5.2 7.5 5.2s7.5-1.8 7.5-5.2c0-3.3-2.1-6.7-6-8.8"/><path d="M12 11v7"/><path d="M14.2 12.7c-.4-.6-1.2-.9-2.2-.9-1.2 0-2.1.6-2.1 1.5 0 2.1 4.3 1 4.3 3.1 0 .9-.9 1.5-2.2 1.5-1 0-1.8-.3-2.2-.9"/></svg></b>Savings</button>
  <button data-v="todo"><b><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.3 12.4l2.7 2.7 4.8-5.4"/></svg></b>To-do</button>
</nav>

  <div id="modal"></div>
  <div id="toast"></div>

  <script src="script.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
